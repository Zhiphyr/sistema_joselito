<div class="module-header">
    <div>
        <h2>Gestión de Usuarios</h2>
        <p>Administra los accesos y permisos de los usuarios</p>
    </div>
    <button class="btn-primary" id="btnNuevoUsuario" style="width: auto;">
        <i class="fas fa-plus"></i> Nuevo Usuario
    </button>
</div>

<div class="welcome-card sin-padding">

    <div class="tabla-toolbar">
        <label for="inputBuscarUsuario">Buscar:</label>
        <input type="text" id="inputBuscarUsuario" class="form-control" placeholder="Nombre, usuario o perfil...">
    </div>

    <div class="tabla-scroll">
        <table class="tabla-modulo">
            <thead>
                <tr>
                    <th class="tabla-th" style="width: 60px;">ID</th>
                    <th class="tabla-th">Nombre</th>
                    <th class="tabla-th">Usuario</th>
                    <th class="tabla-th">Perfil</th>
                    <th class="tabla-th" style="width: 120px;">Estado</th>
                    <th class="tabla-th" style="width: 160px;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody-usuarios"></tbody>
        </table>
    </div>
</div>

<!-- Modal CRUD Usuario -->
<div id="modalUsuario" class="modal-overlay" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">Nuevo Usuario</h3>
            <button class="btn-close" id="btnCerrarModal"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <form id="formUsuario">
                <input type="hidden" id="id_usuario" name="id_usuario">

                <div class="form-group">
                    <label for="nombre">Nombre Completo <span class="required">*</span></label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="usuario_login">Usuario <span class="required">*</span></label>
                    <input type="text" id="usuario_login" name="usuario_login" class="form-control" required autocomplete="off" placeholder="Ej. jperez">
                </div>

                <div class="form-group">
                    <label for="id_perfil">Perfil <span class="required">*</span></label>
                    <select id="id_perfil" name="id_perfil" class="form-control" required>
                        <option value="">Seleccione...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="clave_login" id="labelClave">Contraseña</label>
                    <input type="password" id="clave_login" name="clave_login" class="form-control" autocomplete="new-password">
                    <small id="helpClave" style="color: var(--text-muted); font-size: 12px; display: none; margin-top: 4px;">(Dejar en blanco para no cambiar)</small>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn-secondary" id="btnCancelarModal">Cancelar</button>
                    <button type="submit" class="btn-primary" style="width: auto; padding: 10px 24px;">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
