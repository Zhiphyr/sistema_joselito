<div class="module-header">
    <div>
        <h2>Gestión de Clientes</h2>
        <p>Administra los clientes del sistema logístico</p>
    </div>
    <button class="btn-primary" id="btnNuevoCliente" style="width: auto;">
        <i class="fas fa-plus"></i> Nuevo Cliente
    </button>
</div>

<div class="welcome-card sin-padding">

    <div class="tabla-toolbar">
        <label for="inputBuscarCliente">Buscar:</label>
        <input type="text" id="inputBuscarCliente" class="form-control" placeholder="Nombre, documento o teléfono...">
    </div>

    <div class="tabla-scroll">
        <table class="tabla-modulo">
            <thead>
                <tr>
                    <th class="tabla-th" style="width: 60px;">ID</th>
                    <th class="tabla-th" style="width: 110px;">Tipo Doc.</th>
                    <th class="tabla-th" style="width: 140px;">N° Documento</th>
                    <th class="tabla-th">Nombre / Razón Social</th>
                    <th class="tabla-th" style="width: 130px;">Teléfono</th>
                    <th class="tabla-th" style="width: 120px;">Estado</th>
                    <th class="tabla-th" style="width: 160px;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody-clientes"></tbody>
        </table>
    </div>
</div>

<!-- Modal Principal -->
<div id="modalCliente" class="modal-overlay" style="display: none;">
    <div class="modal-container" style="max-width: 500px;">
        <div class="modal-header">
            <h3 id="modalTitle">Nuevo Cliente</h3>
            <button class="btn-close" id="btnCerrarModal"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <form id="formCliente">
                <input type="hidden" id="id_cliente" name="id_cliente">

                <div class="form-group">
                    <label for="tipo_documento">Tipo de Documento <span class="required">*</span></label>
                    <select id="tipo_documento" name="tipo_documento" class="form-control" required>
                        <option value="DNI">DNI (8 dígitos)</option>
                        <option value="RUC">RUC (11 dígitos)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="numero_documento">Número de Documento <span class="required">*</span></label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="numero_documento" name="numero_documento" class="form-control" required
                            placeholder="Ingrese documento" style="flex: 1;">
                        <button type="button" id="btnBuscarDocumento" class="btn-primary"
                            style="padding: 0 16px; width: auto;" title="Consultar en RENIEC/SUNAT">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="nombre_razon_social">Nombre o Razón Social <span class="required">*</span></label>
                    <input type="text" id="nombre_razon_social" name="nombre_razon_social" class="form-control" required
                        placeholder="Autocompletado al buscar..." readonly
                        style="background-color: #f1f5f9; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección <span class="required">*</span></label>
                    <input type="text" id="direccion" name="direccion" class="form-control" required
                        placeholder="Dirección física">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono <span class="required">*</span></label>
                    <input type="text" id="telefono" name="telefono" class="form-control" required
                        placeholder="N° de contacto">
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" class="form-control" placeholder="Opcional">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn-secondary" id="btnCancelarModal">Cancelar</button>
                    <button type="submit" class="btn-primary" style="width: auto; padding: 10px 24px;">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
