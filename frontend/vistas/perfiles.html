<div class="module-header">
    <div>
        <h2>Gestión de Perfiles</h2>
        <p>Administra los perfiles y sus accesos al sistema</p>
    </div>
    <button class="btn-primary" id="btnNuevoPerfil" style="width: auto;">
        <i class="fas fa-plus"></i> Nuevo Perfil
    </button>
</div>

<div class="welcome-card sin-padding" style="margin-top: 15px; margin-bottom: 15px;">

    <div class="tabla-scroll">
        <table id="tabla-perfiles" class="tabla-modulo display hover stripe" style="width:100%">
            <thead>
                <tr>
                    <th class="tabla-th" style="width: 60px;">ID</th>
                    <th class="tabla-th">Nombre</th>
                    <th class="tabla-th">Descripción</th>
                    <th class="tabla-th" style="width: 120px;">Estado</th>
                    <th class="tabla-th" style="width: 200px;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody-perfiles"></tbody>
        </table>
    </div>
</div>

<!-- Modal 1: CRUD Perfil -->
<div id="modalPerfil" class="modal-overlay" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">Nuevo Perfil</h3>
            <button class="btn-close" id="btnCerrarModal"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <form id="formPerfil">
                <input type="hidden" id="id_perfil" name="id_perfil">

                <div class="form-group">
                    <label for="nombre_perfil">Nombre del Perfil <span class="required">*</span></label>
                    <input type="text" id="nombre_perfil" name="nombre_perfil" class="form-control" required
                        autocomplete="off" placeholder="Ej. OPERADOR LOGISTICO" maxlength="40"
                        oninput="this.value = this.value.toUpperCase().replace(/[^A-Z\s\-]/g, ''); typeof validarBotonGuardarPerfil === 'function' && validarBotonGuardarPerfil();">
                </div>

                <div class="form-group">
                    <label for="descripcion_perfil">Descripción (Opcional)</label>
                    <input type="text" id="descripcion_perfil" name="descripcion_perfil" class="form-control"
                        autocomplete="off" placeholder="Breve descripción del rol...">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn-secondary" id="btnCancelarModal">Cancelar</button>
                    <button type="submit" class="btn-primary" id="btnGuardarPerfil" style="width: auto; padding: 10px 24px;" disabled>Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal 2: Permisos (RBAC) -->
<div id="modalPermisos" class="modal-overlay" style="display: none;">
    <div class="modal-container" style="max-width: 600px;">
        <div class="modal-header">
            <h3>Asignar Accesos: <span id="nombrePerfilPermisos"
                    style="color: var(--text-secondary); font-weight: 500;"></span></h3>
            <button class="btn-close" id="btnCerrarModalPermisos"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <form id="formPermisos">
                <input type="hidden" id="id_perfil_permisos">

                <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 16px;">
                    Selecciona las opciones a las que este perfil tendrá acceso en el menú principal.
                </p>

                <div id="contenedorOpciones" class="opciones-grid">
                    <div style="text-align: center; color: var(--text-muted); grid-column: 1 / -1;"><i
                            class="fas fa-spinner fa-spin"></i> Cargando opciones...</div>
                </div>

                <div
                    style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; border-top: 1px solid var(--border-light); padding-top: 20px;">
                    <button type="button" class="btn-secondary" id="btnCancelarModalPermisos">Cancelar</button>
                    <button type="submit" class="btn-primary" style="width: auto; padding: 10px 24px;">Guardar
                        Permisos</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .opciones-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
        max-height: 350px;
        overflow-y: auto;
        padding-right: 8px;
    }

    .opciones-grid::-webkit-scrollbar {
        width: 6px;
    }

    .opciones-grid::-webkit-scrollbar-thumb {
        background-color: var(--border-light);
        border-radius: 4px;
    }

    .opcion-card {
        border: 1px solid var(--border-light);
        border-radius: var(--radius-md);
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        background: #fafafa;
    }

    .opcion-card:hover {
        border-color: rgba(15, 76, 129, 0.3);
        background: #fff;
    }

    .opcion-card.checked {
        border-color: var(--brand-blue);
        background: rgba(15, 76, 129, 0.05);
    }

    .opcion-card input[type="checkbox"] {
        accent-color: var(--brand-blue);
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    .opcion-info {
        display: flex;
        flex-direction: column;
    }

    .opcion-info span {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
    }

    .opcion-info small {
        font-size: 11px;
        color: var(--text-secondary);
        font-family: monospace;
    }

    /* Estilos modernos para los controles del DataTable */
    #tabla-perfiles_wrapper {
        display: flex;
        flex-direction: column;
        padding: 24px 24px 0 24px; /* Padding superior y lateral para separar de la card */
    }
    
    .dt-top-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        background: #f8fafc;
        padding: 16px 20px;
        border-radius: 12px;
        border: 1px solid var(--border-light);
    }

    .dt-left-controls {
        display: flex;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
    }

    #tabla-perfiles_wrapper .dataTables_length,
    #tabla-perfiles_wrapper .dataTables_filter {
        margin: 0 !important;
        float: none !important;
        text-align: left !important;
    }

    #tabla-perfiles_wrapper .dataTables_length label,
    #tabla-perfiles_wrapper .dataTables_filter label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-weight: 600;
        color: var(--text-secondary);
        font-size: 13px;
    }

    #tabla-perfiles_wrapper .dataTables_length select,
    #tabla-perfiles_wrapper .dataTables_filter input {
        border: 1px solid var(--border-light);
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 13px;
        outline: none;
        transition: all 0.2s;
        background: white;
    }

    #tabla-perfiles_wrapper .dataTables_filter input {
        width: 220px;
    }

    #tabla-perfiles_wrapper .dataTables_length select:focus,
    #tabla-perfiles_wrapper .dataTables_filter input:focus {
        border-color: var(--brand-blue);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* Paginación y info inferior con padding */
    .bottom-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        border-top: 1px solid var(--border-light);
        margin-top: auto;
    }
</style>
