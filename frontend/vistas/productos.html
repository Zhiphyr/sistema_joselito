<div class="module-header">
    <div>
        <h2>Gestión de Productos</h2>
        <p>Administra los tipos de carga y productos</p>
    </div>
    <button class="btn-primary" id="btnNuevoProducto" style="width: auto;">
        <i class="fas fa-plus"></i> Nuevo Producto
    </button>
</div>

<div class="welcome-card sin-padding">

    <div class="tabla-toolbar">
        <label for="inputBuscarProducto">Buscar:</label>
        <input type="text" id="inputBuscarProducto" class="form-control" placeholder="Nombre o descripción...">
    </div>

    <div class="tabla-scroll">
        <table class="tabla-modulo">
            <thead>
                <tr>
                    <th class="tabla-th" style="width: 60px;">ID</th>
                    <th class="tabla-th">Nombre</th>
                    <th class="tabla-th">Descripción</th>
                    <th class="tabla-th" style="width: 120px;">Estado</th>
                    <th class="tabla-th" style="width: 160px;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody-productos"></tbody>
        </table>
    </div>
</div>

<!-- Modal Principal -->
<div id="modalProducto" class="modal-overlay" style="display: none;">
    <div class="modal-container" style="max-width: 500px;">
        <div class="modal-header">
            <h3 id="modalTitle">Nuevo Producto</h3>
            <button class="btn-close" id="btnCerrarModal"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <form id="formProducto">
                <input type="hidden" id="id_producto" name="id_producto">

                <div class="form-group">
                    <label for="nombre_producto">Nombre del Producto <span class="required">*</span></label>
                    <input type="text" id="nombre_producto" name="nombre_producto" class="form-control" required
                        placeholder="Ej. Cajas estándar">
                </div>

                <div class="form-group">
                    <label for="descripcion_producto">Descripción</label>
                    <textarea id="descripcion_producto" name="descripcion_producto" class="form-control" rows="3"
                        placeholder="Detalles opcionales..." style="resize: vertical;"></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn-secondary" id="btnCancelarModal">Cancelar</button>
                    <button type="submit" class="btn-primary" style="width: auto; padding: 10px 24px;">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
