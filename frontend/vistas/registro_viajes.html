<div id="contenedorPrincipalRegistroViaje" style="width: 100%; height: 100%; min-height: 60vh; position: relative;">

        <!-- Icono -->
        <div style="background-color: var(--brand-blue-light); color: var(--brand-blue); width: 88px; height: 88px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 24px;">

        </p>
        
        <!-- Botón -->
        <button id="btnCrearNuevoViaje" class="btn-primary" style="padding: 14px 28px; font-size: 15px; font-weight: 600; border-radius: var(--radius-md); box-shadow: var(--shadow-soft);">
            <i class="fas fa-plus"></i> Crear nuevo viaje
        </button>

    </div>

    <!-- INTERFAZ DE PESTAÑAS (Oculta por defecto) -->
    <div id="interfazTabsViaje" style="display: none; flex-direction: column; height: 100%; width: 100%; opacity: 0; transition: opacity 0.3s ease;">
        
        <!-- Contenedor superior para la barra de pestañas -->
        <nav id="barra-pestanias-viaje" style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border-light); margin-bottom: 24px;">

            </div>

            </button>
        </nav>

        <!-- Contenedor principal donde vivirán los formularios -->
        <div id="contenido-pestanias-viaje" style="flex: 1; display: flex; flex-direction: column;">

        </div>

    </div>
</div>

<!-- TEMPLATE DEL VIAJE -->
<template id="template-viaje">
    <div class="vista-viaje" style="display: none; animation: fadeIn 0.3s ease;">
        <div style="display: flex; flex-direction: column; gap: 24px;">
            
            <!-- Card 1 (Detalles del Viaje) -->
            <div class="welcome-card" style="padding: 24px; max-width: none;">
                <h3 style="font-size: 16px; color: var(--brand-blue); margin-bottom: 20px; font-weight: 600; margin-top: 0;">Detalles del Viaje</h3>
                
                <div class="form-group">
                    <label>Camión Asignado</label>
                    <select class="form-control select-camion" name="id_camion" required>
                        <option value="">Seleccione un camión...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Ruta</label>
                    <select class="form-control select-ruta" name="id_ruta" required>
                        <option value="">Seleccione una ruta...</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label>Fecha de Salida</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Precio Flete Global (S/ por kg)</label>
                        <input type="number" step="0.01" class="form-control flete-global-input" placeholder="0.00">
                    </div>
                </div>
            </div>

            <!-- Card 2 (Cargas Asignadas) -->
            <div class="welcome-card" style="padding: 24px; display: flex; flex-direction: column; max-width: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-box-open" style="color: var(--text-secondary); font-size: 18px;"></i>
                        <h3 style="font-size: 16px; color: var(--text-primary); margin: 0; font-weight: 700;">Cargas Asignadas</h3>
                        <span class="badge-contador-cargas" style="background: #e0f2fe; color: var(--brand-blue); padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; display: none;">0</span>
                    </div>
                    <button class="btn-secondary btn-abrir-modal-carga" onclick="abrirModalNuevaCarga(this)" style="padding: 6px 12px; font-size: 13px; color: var(--text-secondary); border-color: var(--border-light);"><i class="fas fa-plus"></i> Registrar Carga</button>
                </div>
                
                <!-- Contenedor donde se renderizarán las tablas de las cargas (oculto por defecto) -->
                <div class="contenedor-cargas-renderizadas" style="display: flex; flex-direction: column; gap: 16px;"></div>

                <!-- Estado Vacío Cargas -->
                <div class="estado-vacio-cargas" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 1px dashed var(--border-light); border-radius: var(--radius-md); padding: 32px; background-color: var(--surface-bg);">
                    <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; line-height: 1.5;">
                        No hay cargas registradas. Añade cargas al viaje antes de registrarlo.
                    </p>
                    <a href="#" class="btn-abrir-modal-carga" onclick="abrirModalNuevaCarga(this); return false;" style="color: var(--brand-blue); font-size: 14px; font-weight: 500; text-decoration: none;">Registrar primera carga</a>
                </div>
            </div>
            
        </div>

        <!-- Footer -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-bottom: 40px;">
            <div style="background-color: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius-md); padding: 12px 24px; display: flex; gap: 24px;">
                <div>
                    <div style="font-size: 11px; color: #16a34a; font-weight: 700; text-transform: uppercase;">Peso Total Viaje</div>
                    <div style="font-size: 20px; color: #14532d; font-weight: 700;"><span class="texto-peso-total-viaje">0.00</span> kg</div>
                </div>
                <div style="width: 1px; background-color: #bbf7d0;"></div>
                <div>
                    <div style="font-size: 11px; color: #16a34a; font-weight: 700; text-transform: uppercase;">Flete Total Proyectado</div>
                    <div style="font-size: 20px; color: #14532d; font-weight: 700;">S/ <span class="texto-flete-total-viaje">0.00</span></div>
                </div>
            </div>
            
            <button class="btn-primary" style="padding: 14px 32px; font-size: 15px; font-weight: 600;"><i class="fas fa-check" style="margin-right: 8px;"></i> Registrar Viaje</button>
        </div>
    </div>
</template>

<!-- MODAL REGISTRAR NUEVA CARGA -->
<div id="modalNuevaCarga" class="modal-overlay" style="display: none; align-items: flex-start; padding-top: 40px; overflow-y: auto;">
    <div class="modal-container" style="max-width: 800px; margin: auto;">
        
        <div class="modal-header" style="flex-direction: column; align-items: flex-start; gap: 8px;">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                <h3 style="margin: 0;">Registrar Nueva Carga</h3>
                <button class="btn-close" onclick="cerrarModalNuevaCarga()"><i class="fas fa-times"></i></button>
            </div>
            <div style="background-color: var(--brand-blue-light); color: var(--brand-blue); padding: 8px 12px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; width: 100%;">
                <i class="fas fa-info-circle" style="margin-right: 6px;"></i> Flete Global aplicado: <strong id="texto-flete-global-modal">S/ 0.00</strong> por kg
            </div>
        </div>

        <div class="modal-body">
            
            <!-- CLIENTES -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border-light);">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Remitente</label>
                    <select id="select-remitente-modal" class="form-control" required>
                        <option value="">Seleccione un cliente remitente...</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Destinatario</label>
                    <select id="select-destinatario-modal" class="form-control" required>
                        <option value="">Seleccione un cliente destinatario...</option>
                    </select>
                </div>
            </div>

            <!-- PRODUCTOS -->
            <h4 style="font-size: 14px; color: var(--text-primary); margin-bottom: 16px;">Productos de la Carga</h4>
            
            <div id="contenedor-items-carga" style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px;">
                <!-- Bloques dinámicos inyectados aquí -->
            </div>

            <button type="button" class="btn-secondary" onclick="agregarBloqueProducto()" style="width: 100%; border: 1px dashed var(--brand-blue); color: var(--brand-blue); background-color: var(--brand-blue-light); padding: 12px; border-radius: var(--radius-md); margin-bottom: 24px;">
                <i class="fas fa-plus"></i> Registrar otro producto
            </button>

            <!-- FOOTER -->
            <div style="display: flex; justify-content: flex-end; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border-light);">
                <button type="button" class="btn-secondary" onclick="cerrarModalNuevaCarga()">Cancelar</button>
                <button type="button" class="btn-primary" onclick="guardarCargaEnMemoria()">Guardar Carga</button>
            </div>

        </div>
    </div>
</div>
