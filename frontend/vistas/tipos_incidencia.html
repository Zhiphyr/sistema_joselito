<div class="module-header">
    <div>
        <h2>Tipos de Incidencia</h2>
        <p>Catálogo de tipos de daño/robo y su afectación por defecto</p>
    </div>
    <button class="btn-primary" id="btnNuevoTipo" style="width:auto;">
        <i class="fas fa-plus"></i> Nuevo Tipo
    </button>
</div>

<div class="welcome-card sin-padding">
    <div class="tabla-toolbar">
        <label for="inputBuscarTipo">Buscar:</label>
        <input type="text" id="inputBuscarTipo" class="form-control" placeholder="Nombre del tipo...">
    </div>
    <div class="tabla-scroll">
        <table class="tabla-modulo">
            <thead>
                <tr>
                    <th class="tabla-th" style="width:60px;">ID</th>
                    <th class="tabla-th">Nombre</th>
                    <th class="tabla-th" style="width:200px;">Afecta por Defecto</th>
                    <th class="tabla-th" style="width:120px;">Estado</th>
                    <th class="tabla-th" style="width:160px;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody-tipos"></tbody>
        </table>
    </div>
</div>

<!-- Modal CRUD Tipo -->
<div id="modalTipo" class="modal-overlay" style="display:none;">
    <div class="modal-container" style="max-width:460px;">
        <div class="modal-header">
            <h3 id="modalTitleTipo">Nuevo Tipo</h3>
            <button class="btn-close" id="btnCerrarModalTipo"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <form id="formTipo">
                <input type="hidden" id="id_tipo">

                <div class="form-group">
                    <label for="nombre_tipo">Nombre <span class="required">*</span></label>
                    <input type="text" id="nombre_tipo" class="form-control" required autocomplete="off" placeholder="Ej. Robo">
                </div>

                <div class="form-group">
                    <label for="afecta_tipo">Afecta por Defecto <span class="required">*</span></label>
                    <select id="afecta_tipo" class="form-control" required>
                        <option value="Transportista">Transportista</option>
                        <option value="Empresa">Empresa</option>
                        <option value="Cliente">Cliente</option>
                    </select>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
                    <button type="button" class="btn-secondary" id="btnCancelarModalTipo">Cancelar</button>
                    <button type="submit" class="btn-primary" style="width:auto; padding:10px 24px;">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
