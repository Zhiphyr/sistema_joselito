<div class="module-header">
    <div>
        <h2>Incidencias</h2>
        <p>Registro de daños, robos y faltantes sobre las cargas</p>
    </div>
    <button class="btn-primary" id="btnNuevaIncidencia" style="width:auto;">
        <i class="fas fa-plus"></i> Registrar Incidencia
    </button>
</div>

<div class="welcome-card sin-padding">
    <div class="tabla-toolbar">
        <label for="inputBuscarIncidencia">Buscar:</label>
        <input type="text" id="inputBuscarIncidencia" class="form-control" placeholder="Tipo, carga, cliente o descripción...">
    </div>
    <div class="tabla-scroll">
        <table class="tabla-modulo">
            <thead>
                <tr>
                    <th class="tabla-th" style="width:60px;">ID</th>
                    <th class="tabla-th" style="width:70px;">Carga</th>
                    <th class="tabla-th" style="width:70px;">Viaje</th>
                    <th class="tabla-th">Tipo</th>
                    <th class="tabla-th">Descripción</th>
                    <th class="tabla-th" style="width:120px;">Afecta a</th>
                    <th class="tabla-th" style="width:110px; text-align:right;">Monto</th>
                    <th class="tabla-th" style="width:110px;">Fecha</th>
                    <th class="tabla-th" style="width:90px;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody-incidencias"></tbody>
        </table>
    </div>
</div>

<!-- Modal Registro Masivo de Incidencias -->
<div id="modalIncidencia" class="modal-overlay" style="display:none; align-items:flex-start; padding-top:40px; overflow-y:auto;">
    <div class="modal-container" style="max-width:760px; margin:auto;">
        <div class="modal-header">
            <h3>Registrar Incidencia(s)</h3>
            <button class="btn-close" id="btnCerrarModalIncidencia"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">

            <!-- Datos comunes -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="form-group">
                    <label>Viaje <span class="required">*</span></label>
                    <select id="inc-viaje" class="form-control" required>
                        <option value="">Seleccione un viaje...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha <span class="required">*</span></label>
                    <input type="date" id="inc-fecha" class="form-control" required>
                </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="form-group">
                    <label>Tipo de Incidencia <span class="required">*</span></label>
                    <select id="inc-tipo" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label>Afecta a <span class="required">*</span></label>
                    <select id="inc-afecta" class="form-control" required>
                        <option value="Transportista">Transportista (se descuenta de su pago)</option>
                        <option value="Empresa">Empresa</option>
                        <option value="Cliente">Cliente</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Descripción (se aplica a todas las cargas marcadas)</label>
                <textarea id="inc-descripcion" class="form-control" rows="2" placeholder="Ej. Volcadura en KM 150" style="resize:vertical;"></textarea>
            </div>

            <!-- Lista de cargas del viaje con checkbox -->
            <div style="margin-top:8px; border-top:1px solid var(--border-light); padding-top:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h4 style="font-size:14px; color:var(--text-primary); margin:0;">Cargas afectadas</h4>
                    <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); cursor:pointer; margin:0;">
                        <input type="checkbox" id="inc-check-todos" style="width:15px; height:15px;"> Marcar todas
                    </label>
                </div>
                <div id="inc-lista-cargas" style="display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto;">
                    <p style="font-size:13px; color:var(--text-muted); font-style:italic; text-align:center; padding:20px;">Seleccione un viaje para ver sus cargas.</p>
                </div>
            </div>

            <!-- Resumen -->
            <div id="inc-resumen" style="display:none; margin-top:16px; background:#fef2f2; border:1px solid #fecaca; border-radius:var(--radius-md); padding:12px 16px;">
                <div style="display:flex; justify-content:space-between; font-size:13px;">
                    <span style="color:var(--text-secondary);">Cargas marcadas: <strong id="inc-resumen-count" style="color:var(--text-primary);">0</strong></span>
                    <span style="color:var(--text-secondary);">Monto total: <strong id="inc-resumen-monto" style="color:#dc2626;">S/ 0.00</strong></span>
                </div>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
                <button type="button" class="btn-secondary" id="btnCancelarModalIncidencia">Cancelar</button>
                <button type="button" class="btn-primary" id="btnGuardarIncidencia" style="width:auto; padding:10px 24px;">Guardar Incidencias</button>
            </div>
        </div>
    </div>
</div>
