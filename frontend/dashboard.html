<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Transporte Joselito</title>
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="img/ico/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/ico/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/ico/favicon-16x16.png">
    <link rel="manifest" href="img/ico/site.webmanifest">
    <link rel="shortcut icon" href="img/ico/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons (as defined in DB) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SweetAlert2 CDN (Confirmaciones y alertas) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- jsPDF & AutoTable para generación de reportes/boletas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>

    <link rel="stylesheet" href="css/dashboard.css">

    <!-- jQuery y DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
</head>

<body>
    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-truck collapsed-logo" style="display: none; color: white; font-size: 24px;"></i>
                <img src="img/letras-blancas.png" alt="Transporte Joselito" class="sidebar-logo">
            </div>

            <nav class="sidebar-nav">
                <ul id="menuList">

                </ul>
            </nav>
        </aside>

        <!-- Contenedor Principal -->
        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button id="btnToggleSidebar" class="btn-icon">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="topbar-title">
                        <h1 id="viewTitle">Dashboard</h1>
                    </div>
                </div>

                <div class="topbar-user">
                    <div class="user-info">
                        <div class="user-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="user-details">
                            <span class="user-name" id="userName">Cargando...</span>
                            <span class="user-role" id="userRole">...</span>
                        </div>
                    </div>
                    <button id="btnLogout" class="btn-logout" title="Cerrar Sesión">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>

            <div class="content-area" id="app-content">
                <div class="welcome-card">
                    <h2>Cargando interfaz...</h2>
                    <p>Por favor espere.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Contenedor para modales -->
    <div id="app-modals"></div>

    <script src="js/dashboard.js"></script>
</body>

</html>
