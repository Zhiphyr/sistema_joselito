<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Transporte Joselito</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Columna Izquierda: Panel Visual -->
            <div class="login-visual">
                <div class="visual-overlay"></div>
                <div class="visual-content">
                    <div class="visual-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="1" y="3" width="15" height="13" rx="2" ry="2"></rect>
                            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                            <circle cx="5.5" cy="18.5" r="2.5"></circle>
                            <circle cx="18.5" cy="18.5" r="2.5"></circle>
                        </svg>
                    </div>
                    <h2>Transporte Joselito</h2>
                    <p>Eficiencia en ruta, seguridad en destino.</p>
                </div>
            </div>

            <!-- Columna Derecha: Formulario de Login -->
            <div class="login-form-side">
                <div class="login-header">
                    <h1>Iniciar Sesión</h1>
                    <p>Acceso al panel administrativo</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required
                            autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="clave">Contraseña</label>
                        <input type="password" id="clave" name="clave" placeholder="Ingresa tu contraseña" required>
                    </div>

                    <button type="submit" class="btn-primary" id="btnSubmit">
                        <span>Iniciar Sesión</span>
                        <div class="spinner" id="spinner" style="display: none;"></div>
                    </button>
                </form>

                <div class="login-footer">
                    <p>&copy; 2026 Transporte Joselito. Todos los derechos reservados.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
